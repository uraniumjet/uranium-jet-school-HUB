version: '3.9'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: schoolhub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123   # Change this in production!
    ports:
      - "5433:5432"                     # Maps host port 5433 → container 5432 (avoid conflict with local Postgres if any)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: